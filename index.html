<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrabPen</title>
    <link rel="stylesheet" href="./src/style.css">
</head>

<body>
    <div id="menu-screen" class="screen">
        <h1>🦀 CrabPen</h1>
        <p class="subtitle">OneCrab: one crab per row, column, and pen</p>
        <div class="size-grid"></div>
        <div class="menu-status"></div>
    </div>

    <div id="play-screen" class="screen hide">
        <div class="topbar">
            <button class="back">← Menu</button>
            <div class="status"></div>
            <button class="settings-toggle">⚙ Settings</button>
        </div>

        <div class="play-menu hide">
            <button class="new-puzzle">New Puzzle</button>
            <button class="easy-place">Turn off Easy Place</button>
            <button class="undo">Undo</button>
            <button class="redo">Redo</button>
            <button class="clear">Clear</button>
            <button class="hint">Get Hint</button>
        </div>

        <div class="game">
            <div class="canvas"></div>
            <div class="win-overlay hide">
                <h1>Puzzle Solved!</h1>
                <button class="new-puzzle">New Puzzle</button>
            </div>
        </div>
        <div class="hint-desc"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
